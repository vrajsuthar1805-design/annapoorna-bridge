<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="50%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <linearGradient id="vesselGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#16A34A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(10, 8)" filter="url(#glow)">
    <!-- Bridge Arch Foundation -->
    <path d="M 6 72 Q 42 28 78 72" stroke="url(#bridgeGrad)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 16 72 Q 42 42 68 72" stroke="url(#bridgeGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3" fill="none"/>
    <!-- Vertical Cable Stays -->
    <line x1="28" y1="56" x2="28" y2="72" stroke="url(#bridgeGrad)" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="42" y1="46" x2="42" y2="72" stroke="url(#bridgeGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="56" y1="56" x2="56" y2="72" stroke="url(#bridgeGrad)" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Annapoorna Vessel (Akshaya Patra) -->
    <path d="M 27 46 C 27 34 57 34 57 46 C 57 58 27 58 27 46 Z" fill="url(#vesselGrad)"/>
    <ellipse cx="42" cy="40" rx="14" ry="4.5" fill="#FDE68A" stroke="#B45309" stroke-width="1.5"/>
    
    <!-- Golden Grain / Sheaf emerging from vessel -->
    <path d="M 42 38 Q 42 16 46 10" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 44 14 C 48 11 50 15 45 19 C 42 22 41 24 43 27" fill="url(#goldGrad)"/>
    <path d="M 40 18 C 36 15 34 19 39 23 C 41 25 41 28 39 31" fill="url(#goldGrad)"/>
    <path d="M 45 22 C 49 19 51 23 46 27" fill="url(#goldGrad)"/>
    <path d="M 39 26 C 35 24 34 27 38 30" fill="url(#goldGrad)"/>

    <!-- Sustainability Leaf -->
    <path d="M 42 20 Q 56 12 58 26 Q 48 30 42 20 Z" fill="#22C55E"/>
    
    <!-- Foundation Pillars -->
    <rect x="4" y="68" width="8" height="10" rx="2" fill="#0F766E"/>
    <rect x="72" y="68" width="8" height="10" rx="2" fill="#0F766E"/>
    <line x1="2" y1="78" x2="82" y2="78" stroke="#0F766E" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Typography Text -->
  <g transform="translate(105, 20)">
    <!-- Main Title -->
    <text x="0" y="38" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#0F172A" letter-spacing="-0.5">
      Annapoorna <tspan fill="#16A34A">Bridge</tspan>
    </text>
    
    <!-- Subtitle / Tagline -->
    <text x="2" y="58" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#64748B" letter-spacing="1.2">
      SURPLUS FOOD REDISTRIBUTION PLATFORM
    </text>

    <!-- UN SDG Tags -->
    <g transform="translate(2, 65)">
      <!-- SDG 2 Badge -->
      <rect x="0" y="0" width="82" height="14" rx="7" fill="#DDA63A"/>
      <text x="41" y="10.5" font-family="system-ui" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">UN SDG 2: HUNGER</text>
      
      <!-- SDG 11 Badge -->
      <rect x="88" y="0" width="94" height="14" rx="7" fill="#F89D2A"/>
      <text x="135" y="10.5" font-family="system-ui" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">UN SDG 11: CITIES</text>

      <!-- FSSAI Compliant Badge -->
      <rect x="188" y="0" width="88" height="14" rx="7" fill="#15803D"/>
      <text x="232" y="10.5" font-family="system-ui" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">FSSAI COMPLIANT</text>
    </g>
  </g>
</svg>
